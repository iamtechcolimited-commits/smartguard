name: Build APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 1. Cache Buildozer and Android SDK to save massive amounts of time
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 2. Added openjdk-17-jdk (required by Buildozer natively) and fixed libssl-dev
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev automake openjdk-17-jdk
          pip install --upgrade pip
          pip install buildozer Cython virtualenv

      # 3. Running Buildozer directly outside of 'yes |' to prevent infinite loops
      - name: Build APK
        run: |
          buildozer android debug --verbose
        env:
          ACCEPT_SDK_LICENSE_AGREEMENTS: "1"

      - name: Upload APK
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: SmartGuard-APK
          path: bin/*.apk
          if-no-files-found: warn

