name: Build APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev automake
          pip install --upgrade Cython==0.29.36 virtualenv
          pip install buildozer

      - name: Accept SDK Licenses
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools
          yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          rm -rf .buildozer
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartGuard-APK
          path: bin/*.apk
